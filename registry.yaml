# Skills registry — source of truth for published skills.
#
# Each entry must:
#   - Have a matching <path>/SKILL.md on disk
#   - The SKILL.md frontmatter `name` must match the `name` field below
#   - The SKILL.md frontmatter `version` must match the `version` field below
#
# CI (scripts/validate.py) enforces all three. Do not add entries without
# the skill files, and do not commit skill files without a registry entry.

